# Agent OS Standards Index

backend:
  action-transactions:
    description: DB::transaction on every write; return models with relations eager-loaded
  actions:
    description: "Action class shape: static rules(), execute(), shared by HTTP, MCP and Atrium surfaces"
  config-docs:
    description: Config sections carry banner comments with security warnings and modes
  container-bindings:
    description: "Binding lifetimes: scoped for DB-memoizing services, singleton for code state"
  domain-guards:
    description: Business-rule failures throw field-keyed ValidationException
  feature-toggles:
    description: Optional surfaces gated by strict enabled === true config checks
  http-requests:
    description: Thin controllers; FormRequests own validation, action call, and response via persist()
  http-resources:
    description: "Resource serialization: slug/route-key identity, whenLoaded relations, ISO8601 timestamps"
  mcp-model-binding:
    description: Per-model abstract McpRequest bases resolve identifier to model
  mcp-responses:
    description: Structured responses use data envelope and shared HTTP Resources
  mcp-schemas:
    description: Schema field descriptions and shared payload traits
  mcp-tools:
    description: Declarative tool shells; logic in McpRequest classes mirroring FormRequests
  publish-tags:
    description: Umbrella roster tag plus roster-<thing> tag, console-only
  routes:
    description: Config-driven prefix/middleware, named roster.* routes, POST verb suffixes
  runtime-exceptions:
    description: Typed final RuntimeExceptions with forX() constructors for system-state failures
  slug-references:
    description: Records referenced by slug; host users by route key

database:
  migrations:
    description: Fixed 2026_01_01 date + sequence, one file per feature, ULID keys
  models:
    description: Final models, roster_ table prefix, HasUlids, explicit fillable and docblocks

testing:
  arch-tests:
    description: Global constraints enforced in tests/ArchTest.php
  mcp-http-parity:
    description: MCP structured content must equal the HTTP payload
  test-layers:
    description: Business rules tested at the Action; surfaces test only wiring
  testcase-environment:
    description: Pinned Testbench environment, providers and per-test config
