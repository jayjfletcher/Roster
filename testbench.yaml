laravel: '@testbench'

env:
  # Impex runs drive inline, so imports and exports finish without a worker.
  - QUEUE_CONNECTION=sync

providers:
  - Laravel\Mcp\Server\McpServiceProvider
  - RefactorCircus\Atrium\AtriumServiceProvider
  - RefactorCircus\Roster\RosterServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations
  - database/migrations
  # refactor-circus/cortex is a dev dependency and auto-discovered, so the demo runs with it.
  - vendor/refactor-circus/cortex/database/migrations
  # refactor-circus/impex (dev dependency, auto-discovered) runs CSV imports and exports.
  - vendor/refactor-circus/impex/database/migrations
  # refactor-circus/pennantplus (dev dependency, auto-discovered) decides RosterSupportFeature
  # through Pennant, whose features table lives here.
  - vendor/laravel/pennant/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/atrium'
  user: admin@example.com
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
    # Atrium's stylesheet and scripts, republished on every build so the
    # dashboard always matches the installed Atrium.
    - atrium-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
